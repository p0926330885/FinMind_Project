name: Daily FinMind Pipeline

on:
  # 台灣時間排程(週一~五)
  # 班次一 TWT 18:37 (UTC 10:37) - 法人資料若還沒出(FinMind 20:00 才更新),管線自動保留前一日
  # 班次二 TWT 20:47 (UTC 12:47) - 法人資料入庫後的正式更新(分鐘數避開整點,減少 GitHub 延遲)
  # v1.6 pipeline 已內建缺洞感知 + FORCE_REFETCH_DAYS=15 自動修復,
  # 第二次排程會自動補齊第一次漏抓的資料。
  schedule:
    - cron: '37 10 * * 1-5'   # UTC 10:37 = TWT 18:37
    - cron: '47 12 * * 1-5'   # UTC 12:47 = TWT 20:47
  # 允許在網頁上手動按鈕執行
  workflow_dispatch:

permissions:
  contents: write   # 允許把跑出來的 bubble_data.json commit 回倉庫

# 避免兩個排程剛好重疊時互踩(理論上不會,但保險起見)
concurrency:
  group: finmind-pipeline
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: 取出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 執行管線
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          # 若 FinMind 額度常爆,把下面數字調小(預設 15)
          # FORCE_REFETCH_DAYS: "7"
        run: python finmind_pipeline.py

      - name: 把最新資料存回倉庫
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          git diff --staged --quiet || git commit -m "auto: update bubble_data.json ($(date -u +%Y-%m-%d\ %H:%M) UTC)"
          git push
