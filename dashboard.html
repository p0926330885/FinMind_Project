<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>板塊資金儀表板 · 第一階段+</title>
<style>
  :root{--bg:#0a141d;--panel:#10202c;--panel2:#0d1a24;--line:#22384a;--line-soft:#1a2c3a;
    --ink:#e8f1f6;--ink-dim:#8aa3b4;--ink-faint:#5b7688;--red:#ff495f;--red-soft:#ff8091;
    --green:#1ec98a;--green-soft:#5fe0b0;--amber:#f4b53f;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(1100px 650px at 82% -10%,#14293a 0,transparent 60%),var(--bg);
    color:var(--ink);font-family:"Inter","Noto Sans TC","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;padding:20px;}
  .num{font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;}
  .wrap{max-width:1120px;margin:0 auto;}
  .head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  h1{font-size:19px;font-weight:700;}
  h1 .a{color:var(--amber);}
  .glink{font-size:12px;color:var(--amber);text-decoration:none;border:1px solid var(--line);padding:3px 9px;border-radius:7px;margin-left:6px;}
  .meta{font-size:11.5px;color:var(--ink-dim);text-align:right;line-height:1.5;}
  .meta b{color:var(--ink);}
  .banner{background:rgba(244,181,63,.12);border:1px solid #4a3a18;color:var(--amber);font-size:12px;
    padding:8px 12px;border-radius:9px;margin-top:12px;display:none;align-items:center;gap:10px;flex-wrap:wrap;}
  .banner.show{display:flex;}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font-family:inherit;font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;}
  .btn:hover{border-color:var(--amber);color:var(--amber);}

  .toolbar{display:flex;gap:18px;flex-wrap:wrap;margin:14px 0 2px;}
  .tg{display:flex;flex-direction:column;gap:5px;}
  .tg .lab{font-size:10px;color:var(--ink-faint);letter-spacing:.4px;}
  .seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;overflow:hidden;}
  .seg button{background:none;border:none;color:var(--ink-dim);font-family:inherit;font-size:12.5px;padding:6px 13px;cursor:pointer;transition:.12s;}
  .seg button.on{background:var(--amber);color:#1a1206;font-weight:700;}

  .grid{display:grid;grid-template-columns:1fr 388px;gap:16px;margin-top:12px;}
  @media(max-width:920px){.grid{grid-template-columns:1fr}}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);border-radius:13px;padding:12px;}
  .card h2{font-size:12px;color:var(--ink-faint);letter-spacing:.4px;margin-bottom:2px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  svg{display:block;width:100%;height:auto;}
  .qlabel{font-size:11px;font-weight:700;} .axtick{font-size:9px;fill:var(--ink-faint);}
  .axtitle{font-size:10px;fill:var(--ink-dim);} .blabel{font-size:10px;fill:var(--ink);pointer-events:none;}
  .bub{cursor:pointer;transition:opacity .1s;}

  .player{display:flex;align-items:center;gap:10px;margin-top:8px;padding-top:8px;border-top:1px solid var(--line-soft);}
  .player.hidden{display:none;}
  .pbtn{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .pbtn:hover{border-color:var(--amber);color:var(--amber);}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;background:var(--line);border-radius:3px;outline:none;cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--amber);border:2px solid var(--bg);}
  .pdate{font-size:11px;color:var(--amber);min-width:82px;text-align:center;}
  .speeds{display:flex;gap:4px;}
  .speeds button{background:var(--panel);border:1px solid var(--line);color:var(--ink-dim);font-size:11px;padding:3px 7px;border-radius:6px;cursor:pointer;font-family:inherit;}
  .speeds button.on{border-color:var(--amber);color:var(--amber);}

  table{width:100%;border-collapse:collapse;margin-top:4px;}
  th,td{padding:7px 9px;font-size:12.5px;text-align:right;white-space:nowrap;}
  th{font-size:10px;color:var(--ink-faint);border-bottom:1px solid var(--line);cursor:pointer;user-select:none;}
  th.on{color:var(--amber);} th:first-child,td:first-child{text-align:left;}
  tbody tr{cursor:pointer;border-top:1px solid var(--line-soft);}
  tbody tr:hover{background:var(--panel2);} tbody tr.sel{background:rgba(244,181,63,.13);}
  td.name{font-weight:600;} .flag{color:var(--amber);}
  .pos{color:var(--red);} .neg{color:var(--green);} .dim{color:var(--ink-faint);}

  .detail .dh{font-size:16px;font-weight:800;margin-bottom:1px;}
  .detail .dmeta{font-size:11.5px;color:var(--ink-dim);margin-bottom:10px;}
  .split{display:flex;gap:7px;margin-bottom:10px;}
  .chip{flex:1;background:var(--panel2);border:1px solid var(--line-soft);border-radius:8px;padding:7px 9px;}
  .chip .k{font-size:10px;color:var(--ink-faint);} .chip .v{font-size:14px;font-weight:700;margin-top:2px;}
  .mem{max-height:300px;overflow-y:auto;}
  .mrow{padding:7px 2px;border-top:1px solid var(--line-soft);font-size:12px;}
  .mrow:first-child{border-top:none;}
  .mtop{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;}
  .mtop .mn{font-weight:600;} .mtop .mn span{color:var(--ink-faint);font-size:10px;font-family:"JetBrains Mono",monospace;}
  .mtop .mv{text-align:right;font-family:"JetBrains Mono",monospace;font-size:12px;}
  .mbar{height:6px;border-radius:3px;margin:4px 0 3px;opacity:.7;}
  .mbreak{font-size:10.5px;color:var(--ink-faint);font-family:"JetBrains Mono",monospace;}
  .mbreak b{font-weight:600;} .spark{margin-top:12px;} .spark .sh{font-size:10.5px;color:var(--ink-faint);margin-bottom:3px;}
  .empty{color:var(--ink-faint);font-size:12.5px;padding:22px 6px;text-align:center;}
  .note{color:var(--ink-faint);font-size:11px;margin-top:14px;line-height:1.6;text-align:center;}
  input[type=file]{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1><span class="a">板塊資金</span>儀表板 <span style="font-size:12px;color:var(--ink-faint);font-weight:400">第一階段+ · 法人資金</span> <a class="glink" href="./guide.html">📖 使用說明</a></h1>
    <div class="meta" id="meta">載入中…</div>
  </div>
  <div class="banner" id="banner">
    <span id="bannerMsg"></span>
    <label class="btn">選擇 bubble_data.json<input type="file" id="fileIn" accept=".json"></label>
    <button class="btn" onclick="tryFetch()">重新自動載入</button>
  </div>

  <div class="toolbar">
    <div class="tg"><span class="lab">法人別</span>
      <div class="seg" id="segInv">
        <button data-k="total" class="on">三大合計</button><button data-k="foreign">外資</button><button data-k="trust">投信</button><button data-k="dealer">自營</button>
      </div>
    </div>
    <div class="tg"><span class="lab">統計期間</span>
      <div class="seg" id="segPer">
        <button data-d="1" class="on">近1日</button><button data-d="5">近5日</button><button data-d="10">近10日</button><button data-d="20">近20日</button>
      </div>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h2><span id="bubTitle">板塊資金泡泡</span><span style="font-weight:400;color:var(--ink-faint)">X 強度% · Y 異常z · 大小 成交值 · 光暈 內部分歧</span></h2>
      <svg id="bubble" viewBox="0 0 640 440"></svg>
      <div class="player hidden" id="player">
        <button class="pbtn" id="playBtn"><svg id="playIco" width="14" height="14" viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg></button>
        <input type="range" id="scrub" min="0" max="0" value="0" step="1">
        <span class="pdate num" id="pdate">—</span>
        <div class="speeds" id="speeds">
          <button data-s="0.25">0.25×</button><button data-s="0.5">0.5×</button><button data-s="1" class="on">1×</button><button data-s="2">2×</button>
        </div>
        <button class="btn" id="todayBtn" style="padding:4px 10px">回到今日</button>
      </div>
    </div>
    <div class="card detail" id="detail"><div class="empty">點左邊泡泡或下方表格,看板塊明細</div></div>
  </div>

  <div class="card" style="margin-top:16px;">
    <h2><span id="tblTitle">資金流向表</span><span style="font-weight:400;color:var(--ink-faint)">點欄位標題排序 · 點列看明細</span></h2>
    <table><thead><tr id="thead"></tr></thead><tbody id="tbody"></tbody></table>
  </div>

  <div class="note">
    強度%＝期間淨流入÷期間成交值;z＝該期間相對自己近期常態。<span class="flag">⚑</span>=小板塊(強度/z 易失真)。
    <b style="color:var(--amber)">光暈=板塊內部資金分歧</b>(大而糊=一半流入一半流出)。<br>
    切換法人別/期間,全圖與明細同步用真實資料重算。播放(近20日輪動)僅在「近1日」提供。集中度/家數差需分點資料(第二階段)。
  </div>
</div>

<script>
// ── 範例資料(schema 2;僅未載入真實檔時墊著) ──
function makeSample(){
  const dates=Array.from({length:22},(_,i)=>`D${i+1}`);
  const defs=[
    {name:"晶圓製造",mem:[["台積電","2330",30,1.0],["聯電","2303",10,0.4]]},
    {name:"探針卡",mem:[["旺矽","6223",2.5,1.0],["穎崴","6515",1.5,-0.3]]},
    {name:"ABF/BT",mem:[["欣興","3037",26,-1.0],["南電","8046",20,-0.6]]},
    {name:"散熱",mem:[["奇鋐","3017",26,0.6],["雙鴻","3324",20,0.2]]},
  ];
  return {as_of_date:"範例",generated_at:"—",phase:1.5,schema:2,dates,
    config:{liquidity_floor_100m_twd:3.0,history_days:20,output_days:22},
    sectors:defs.map(D=>({name:D.name,
      history:dates.map((d,i)=>{let f=0,t=0,dl=0,to=0;D.mem.forEach(m=>{const b=m[3]*Math.sin(i/3+m[2])*0.4;f+=b*0.6;t+=b*0.25;dl+=b*0.15;to+=m[2];});return {d,f:+f.toFixed(3),t:+t.toFixed(3),dl:+dl.toFixed(3),to:+to.toFixed(1)};}),
      members:D.mem.map(m=>({name:m[0],code:m[1],hist:dates.map((d,i)=>{const b=m[3]*Math.sin(i/3+m[2])*0.4;const fv=b*0.6,tv=b*0.25,dv=b*0.15;return {d,fv:+fv.toFixed(3),fl:Math.round(fv*300),tv:+tv.toFixed(3),tl:Math.round(tv*300),dv:+dv.toFixed(3),dl:Math.round(dv*300)};})}))
    }))};
}

let DATA=null, sel=null, investorKey="total", periodDays=1, sortKey="netflow", sortDir=-1;
let frame=null, playing=false, speed=1, lastT=0, dailyCache={};
const $=id=>document.getElementById(id);
const NS="http://www.w3.org/2000/svg";
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const mean=a=>a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
const std=a=>{const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/(a.length||1));};
const fmt=(v,d=2,plus=true)=>(v==null||isNaN(v))?'—':(plus&&v>=0?'+':'')+Number(v).toFixed(d);
const col=v=>v>=0?'var(--red)':'var(--green)';
const floorVal=()=> (DATA&&DATA.config&&DATA.config.liquidity_floor_100m_twd)||3;

// ── 存取器(對映 schema 2 欄位) ──
function secVal(h,inv){ if(inv==='foreign')return h.f||0; if(inv==='trust')return h.t||0; if(inv==='dealer')return h.dl||0; return (h.f||0)+(h.t||0)+(h.dl||0);}
function memVal(h,inv){ if(inv==='foreign')return h.fv||0; if(inv==='trust')return h.tv||0; if(inv==='dealer')return h.dv||0; return (h.fv||0)+(h.tv||0)+(h.dv||0);}
function memLots(h,inv){ if(inv==='foreign')return h.fl||0; if(inv==='trust')return h.tl||0; if(inv==='dealer')return h.dl||0; return (h.fl||0)+(h.tl||0)+(h.dl||0);}
function sumLastN(arr,W,fn){const n=arr.length;let s=0;for(let i=Math.max(0,n-W);i<n;i++)s+=(fn(arr[i])||0);return s;}

// ── 板塊指標(依 目前 法人別+期間) ──
function computeSector(s){
  const H=s.history||[], W=periodDays;
  const netflow=sumLastN(H,W,h=>secVal(h,investorKey));
  const turnover=sumLastN(H,W,h=>h.to||0);
  const intensity=turnover>0? netflow/turnover*100 : null;
  const roll=[]; for(let k=W-1;k<H.length;k++){let sm=0;for(let j=k-W+1;j<=k;j++)sm+=secVal(H[j],investorKey);roll.push(sm);}
  let z=null; if(roll.length>=3){const prior=roll.slice(0,-1); if(std(prior)>0) z=(roll[roll.length-1]-mean(prior))/std(prior);}
  let pos=0,neg=0; (s.members||[]).forEach(m=>{const v=sumLastN(m.hist||[],W,h=>memVal(h,investorKey)); if(v>=0)pos+=v;else neg+=-v;});
  const dv=(pos+neg>0)?Math.min(pos,neg)/(pos+neg):0;
  const below= turnover>0 && (turnover/W)<floorVal();
  return {netflow,turnover,intensity,z,divergence:dv,below_floor:below};
}

// ── 每日序列(播放用,依法人別) ──
function dailySeries(s){
  const key=s.name+"|"+investorKey; if(dailyCache[key])return dailyCache[key];
  const H=s.history||[]; const val=H.map(h=>secVal(h,investorKey)), to=H.map(h=>h.to||0);
  const arr=H.map((h,i)=>{
    const inten= to[i]>0? val[i]/to[i]*100 : 0;
    let z=null; const prior=val.slice(0,i); if(prior.length>=3&&std(prior)>0) z=(val[i]-mean(prior))/std(prior);
    return {d:h.d, val:val[i], to:to[i], intensity:inten, z:(z==null?0:z)};
  });
  dailyCache[key]=arr; return arr;
}

// ── 載入 ──
function tryFetch(){
  fetch('./data/bubble_data.json',{cache:"no-store"})
    .then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
    .then(d=>{ setData(d,false); $('banner').classList.remove('show'); })
    .catch(err=>{ $('bannerMsg').textContent="無法自動讀取 ./data/bubble_data.json（"+err.message+"）。請用 python -m http.server 開,或手動選檔:";
      $('banner').classList.add('show'); if(!DATA) setData(makeSample(),true); });
}
$('fileIn').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const rd=new FileReader();
  rd.onload=()=>{try{setData(JSON.parse(rd.result),false);$('banner').classList.remove('show');}catch(e){$('bannerMsg').textContent="解析失敗:"+e.message;}};rd.readAsText(f);};
function setData(d,sample){
  if(!sample && Number(d.schema)!==2){
    $('bannerMsg').textContent="偵測到『舊格式』的 bubble_data.json。請到 GitHub → Actions 重跑一次 Daily FinMind Pipeline,產生新版資料,法人/期間快捷鍵才會有真數字。以下先顯示範例:";
    $('banner').classList.add('show'); d=makeSample(); sample=true;
  }
  DATA=d; sel=null; frame=null; setPlaying(false); dailyCache={};
  $('meta').innerHTML= sample? '<b style="color:var(--amber)">範例資料</b>（尚未載入真實檔）'
    : `資料日 <b>${d.as_of_date}</b> · 產生於 ${d.generated_at||'—'} · ${(d.sectors||[]).length} 板塊`;
  renderAll();
}

// ── 泡泡圖 ──
function drawBubble(){
  const svg=$('bubble'); svg.innerHTML=''; if(!DATA)return;
  const W=640,H=440,M={l:52,r:24,t:30,b:46};
  const anim = frame!=null;
  // 計算各板塊點
  let pts;
  if(anim){ const N=(DATA.dates||[]).length;
      const i=Math.max(0,Math.min(N-1,Math.floor(frame))), j=Math.min(N-1,i+1), t=frame-i;
      const lp=(a,b)=>a+(b-a)*t;
      pts=DATA.sectors.map(s=>{const ser=dailySeries(s); const a=ser[i]||{intensity:0,z:0,val:0,to:0}, b=ser[j]||a;
      let pos=0,neg=0;(s.members||[]).forEach(m=>{const v=memVal((m.hist||[])[i]||{},investorKey);if(v>=0)pos+=v;else neg+=-v;});
      const dv=(pos+neg>0)?Math.min(pos,neg)/(pos+neg):0;
      return {s,x:lp(a.intensity,b.intensity),y:lp(a.z,b.z),size:lp(a.to,b.to),c:col(lp(a.val,b.val)),dv};});
  } else { pts=DATA.sectors.map(s=>{const m=computeSector(s);return {s,x:m.intensity||0,y:m.z||0,size:m.turnover,c:col(m.netflow),dv:m.divergence,below:m.below_floor};}); }
  let xMax=10,yMax=1.5,toMax=1;
  if(anim){ DATA.sectors.forEach(s=>dailySeries(s).forEach(p=>{xMax=Math.max(xMax,Math.abs(p.intensity));yMax=Math.max(yMax,Math.abs(p.z));toMax=Math.max(toMax,p.to);})); }
  else { pts.forEach(p=>{xMax=Math.max(xMax,Math.abs(p.x));yMax=Math.max(yMax,Math.abs(p.y));toMax=Math.max(toMax,p.size);}); }
  xMax*=1.15; yMax*=1.15;
  const X=v=>M.l+(v+xMax)/(2*xMax)*(W-M.l-M.r), Y=v=>M.t+(yMax-v)/(2*yMax)*(H-M.t-M.b);
  const cx=X(0),cy=Y(0);
  el('rect',{x:X(0),y:M.t,width:X(xMax)-X(0),height:cy-M.t,fill:'rgba(255,73,95,.07)'},svg);
  el('rect',{x:M.l,y:M.t,width:X(0)-M.l,height:cy-M.t,fill:'rgba(244,181,63,.05)'},svg);
  el('rect',{x:M.l,y:cy,width:X(0)-M.l,height:Y(-yMax)-cy,fill:'rgba(30,201,138,.06)'},svg);
  el('rect',{x:X(0),y:cy,width:X(xMax)-X(0),height:Y(-yMax)-cy,fill:'rgba(120,160,190,.04)'},svg);
  el('line',{x1:cx,y1:M.t,x2:cx,y2:Y(-yMax),stroke:'var(--line)','stroke-width':1.5},svg);
  el('line',{x1:M.l,y1:cy,x2:X(xMax),y2:cy,stroke:'var(--line)','stroke-width':1.5},svg);
  el('text',{x:X(xMax)-6,y:M.t+15,'text-anchor':'end',class:'qlabel',fill:'var(--red)'},svg).textContent='流入且異常熱';
  el('text',{x:M.l+6,y:Y(-yMax)-8,'text-anchor':'start',class:'qlabel',fill:'var(--green)'},svg).textContent='流出且偏冷';
  el('text',{x:cx,y:H-10,'text-anchor':'middle',class:'axtitle'},svg).textContent='挹注強度 %　流出 ← → 流入';
  el('text',{x:14,y:cy,'text-anchor':'middle',class:'axtitle',transform:`rotate(-90 14 ${cy})`},svg).textContent='異常度 z　冷 ← → 熱';
  pts.forEach(p=>{
    const x=X(p.x),y=Y(p.y), r=8+Math.sqrt((p.size||0)/toMax)*24;
    const g=el('g',{class:'bub'},svg); g.addEventListener('click',()=>select(p.s.name));
    const faded=sel&&sel!==p.s.name;
    if(!faded && p.dv>=0.04){ const hr=r+p.dv*2*26;
      el('circle',{cx:x,cy:y,r:hr,fill:p.c,opacity:0.05+p.dv*0.30},g);
      el('circle',{cx:x,cy:y,r:hr,fill:'none',stroke:p.c,'stroke-width':1,'stroke-dasharray':'3 4',opacity:0.22+p.dv*0.6},g);}
    el('circle',{cx:x,cy:y,r,fill:p.c,opacity:faded?.22:.82,stroke:sel===p.s.name?'var(--amber)':p.c,'stroke-width':sel===p.s.name?2.5:1.5},g);
    if(!faded||sel===p.s.name) el('text',{x,y:y-r-4,'text-anchor':'middle',class:'blabel'},g).textContent=p.s.name+(p.below?' ⚑':'');
  });
}

// ── 表格 ──
const COLS=[{k:"name",label:"板塊"},{k:"netflow",label:"淨流入(億)"},{k:"intensity",label:"強度%"},{k:"zscore",label:"z"},{k:"turnover",label:"成交值(億)"}];
function drawTable(){
  if(!DATA)return;
  const th=$('thead'); th.innerHTML='';
  COLS.forEach(c=>{const e=document.createElement('th');
    e.textContent=c.label+(sortKey===c.k?(sortDir<0?' ▼':' ▲'):'');
    e.className=sortKey===c.k?'on':'';
    e.onclick=()=>{if(sortKey===c.k)sortDir*=-1;else{sortKey=c.k;sortDir=(c.k==="name"?1:-1);}drawTable();};
    th.appendChild(e);});
  const rows=DATA.sectors.map(s=>({s,m:computeSector(s)}));
  rows.sort((a,b)=>{
    if(sortKey==="name")return sortDir*String(a.s.name).localeCompare(String(b.s.name),'zh-Hant');
    const map={netflow:"netflow",intensity:"intensity",zscore:"z",turnover:"turnover"};
    const va=a.m[map[sortKey]]??-1e9, vb=b.m[map[sortKey]]??-1e9; return sortDir*(va-vb);});
  const tb=$('tbody'); tb.innerHTML='';
  rows.forEach(({s,m})=>{const tr=document.createElement('tr'); if(sel===s.name)tr.className='sel';
    tr.onclick=()=>select(s.name);
    tr.innerHTML=[
      `<td class="name">${m.below_floor?'<span class="flag">⚑</span> ':''}${s.name}</td>`,
      `<td class="num ${m.netflow>=0?'pos':'neg'}">${fmt(m.netflow)}</td>`,
      `<td class="num ${(m.intensity??0)>=0?'pos':'neg'}">${fmt(m.intensity)}</td>`,
      `<td class="num ${(m.z??0)>=0?'pos':'neg'}">${m.z==null?'<span class="dim">—</span>':fmt(m.z,1)}</td>`,
      `<td class="num dim">${fmt(m.turnover,1,false)}</td>`].join('');
    tb.appendChild(tr);});
}

// ── 明細(個股 近X日 外資/投信/自營 值+張) ──
function drawDetail(){
  const box=$('detail'); if(!DATA){box.innerHTML='';return;}
  if(!sel){box.innerHTML='<div class="empty">點左邊泡泡或下方表格,看板塊明細</div>';return;}
  const s=DATA.sectors.find(x=>x.name===sel); if(!s){box.innerHTML='';return;}
  const W=periodDays, m=computeSector(s);
  const sideV=inv=>sumLastN(s.history||[],W,h=>secVal(h,inv));
  const label={total:"三大合計",foreign:"外資",trust:"投信",dealer:"自營"}[investorKey];
  // 個股
  const mem=(s.members||[]).map(mm=>{
    const h=mm.hist||[];
    const val=sumLastN(h,W,x=>memVal(x,investorKey)), lots=sumLastN(h,W,x=>memLots(x,investorKey));
    return {name:mm.name,code:mm.code,val,lots,
      f:sumLastN(h,W,x=>x.fv||0), fl:sumLastN(h,W,x=>x.fl||0),
      t:sumLastN(h,W,x=>x.tv||0), tl:sumLastN(h,W,x=>x.tl||0),
      d:sumLastN(h,W,x=>x.dv||0), dl:sumLastN(h,W,x=>x.dl||0)};
  }).sort((a,b)=>b.val-a.val);
  const mMax=Math.max(...mem.map(x=>Math.abs(x.val)),0.001);
  let html=`<div class="dh">${m.below_floor?'<span class="flag">⚑</span> ':''}${s.name}</div>
    <div class="dmeta">${label} · 近${W}日　淨流入 <b class="${m.netflow>=0?'pos':'neg'}">${fmt(m.netflow)}億</b> ·
      強度 <b class="${(m.intensity??0)>=0?'pos':'neg'}">${fmt(m.intensity)}%</b> ·
      z <b class="${(m.z??0)>=0?'pos':'neg'}">${m.z==null?'—':fmt(m.z,1)}</b> ·
      內部分歧 <b style="color:${m.divergence>=0.35?'var(--amber)':'var(--ink-dim)'}">${(m.divergence*200).toFixed(0)}%</b></div>
    <div class="split">
      <div class="chip"><div class="k">外資近${W}日(億)</div><div class="v num ${sideV('foreign')>=0?'pos':'neg'}">${fmt(sideV('foreign'))}</div></div>
      <div class="chip"><div class="k">投信近${W}日(億)</div><div class="v num ${sideV('trust')>=0?'pos':'neg'}">${fmt(sideV('trust'))}</div></div>
      <div class="chip"><div class="k">自營近${W}日(億)</div><div class="v num ${sideV('dealer')>=0?'pos':'neg'}">${fmt(sideV('dealer'))}</div></div>
    </div>
    <div style="font-size:10.5px;color:var(--ink-faint);margin-bottom:4px">成分股 · 近${W}日(長條=${label}淨流入;下排=外資/投信/自營 金額(億)/張數)</div>
    <div class="mem">`;
  mem.forEach(x=>{
    const w=Math.abs(x.val)/mMax*100;
    html+=`<div class="mrow">
      <div class="mtop"><div class="mn">${x.name} <span>${x.code}</span></div>
        <div class="mv ${x.val>=0?'pos':'neg'}">${fmt(x.val)}億 / ${x.lots>=0?'+':''}${Math.round(x.lots)}張</div></div>
      <div class="mbar" style="width:${w}%;background:${col(x.val)}"></div>
      <div class="mbreak">外 <b class="${x.f>=0?'pos':'neg'}">${fmt(x.f)}</b>/<b class="${x.fl>=0?'pos':'neg'}">${Math.round(x.fl)}</b> ·
        投 <b class="${x.t>=0?'pos':'neg'}">${fmt(x.t)}</b>/<b class="${x.tl>=0?'pos':'neg'}">${Math.round(x.tl)}</b> ·
        自 <b class="${x.d>=0?'pos':'neg'}">${fmt(x.d)}</b>/<b class="${x.dl>=0?'pos':'neg'}">${Math.round(x.dl)}</b></div>
    </div>`;
  });
  html+='</div>';
  // sparkline:板塊 選定法人 每日淨流入
  const H=s.history||[];
  if(H.length>1) html+=`<div class="spark"><div class="sh">${label} 每日淨流入(億) · 近${Math.min(H.length,20)}日</div><svg id="spk" viewBox="0 0 348 60" style="width:100%;height:60px"></svg></div>`;
  box.innerHTML=html;
  if(H.length>1) drawSpark(H.slice(-20));
}
function drawSpark(H){
  const svg=$('spk'); if(!svg)return; svg.innerHTML='';
  const w=348,ht=60,pad=6; const vals=H.map(h=>secVal(h,investorKey));
  const mn=Math.min(0,...vals),mx=Math.max(0,...vals);
  const X=i=>pad+i/(H.length-1)*(w-2*pad), Y=v=>ht-pad-(v-mn)/((mx-mn)||1)*(ht-2*pad);
  el('line',{x1:pad,y1:Y(0),x2:w-pad,y2:Y(0),stroke:'var(--line)','stroke-width':1},svg);
  H.forEach((h,i)=>{const v=secVal(h,investorKey);el('line',{x1:X(i),y1:Y(0),x2:X(i),y2:Y(v),stroke:col(v),'stroke-width':2,opacity:.75},svg);});
  el('path',{d:'M'+H.map((h,i)=>X(i)+','+Y(secVal(h,investorKey))).join(' L'),fill:'none',stroke:'var(--amber)','stroke-width':1.5,opacity:.9},svg);
}

// ── 切換 ──
function scopeText(){const L={total:"三大合計",foreign:"外資",trust:"投信",dealer:"自營"}[investorKey];
  $('bubTitle').textContent=`板塊資金泡泡 · ${L}近${periodDays}日`; $('tblTitle').textContent=`資金流向表 · ${L}近${periodDays}日`;}
$('segInv').onclick=e=>{const b=e.target.closest('button');if(!b)return;investorKey=b.dataset.k;dailyCache={};
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b)); if(frame!=null)exitAnim(); renderAll();};
$('segPer').onclick=e=>{const b=e.target.closest('button');if(!b)return;periodDays=Number(b.dataset.d);
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));
  if(periodDays!==1) exitAnim(); updatePlayerVisibility(); renderAll();};

// ── 播放(僅近1日) ──
function updatePlayerVisibility(){const p=$('player');
  const ok=periodDays===1 && DATA && (DATA.dates||[]).length>2;
  p.classList.toggle('hidden',!ok);
  if(ok){$('scrub').max=(DATA.dates.length-1);}}
function setPlaying(p){playing=p;$('playIco').innerHTML=p?'<rect x="3.5" y="2.5" width="3.5" height="11" fill="currentColor"/><rect x="9" y="2.5" width="3.5" height="11" fill="currentColor"/>':'<path d="M4 2.5v11l9-5.5z" fill="currentColor"/>';lastT=performance.now();}
function setFrame(i){frame=i;$('scrub').value=i;$('pdate').textContent=(DATA.dates||[])[i]||'—';drawBubble();}
function exitAnim(){frame=null;setPlaying(false);$('pdate').textContent='今日';if(DATA&&DATA.dates)$('scrub').value=DATA.dates.length-1;drawBubble();}
$('playBtn').onclick=()=>{if(periodDays!==1||!DATA)return;if(frame==null)frame=0;setPlaying(!playing);};
$('scrub').oninput=e=>{setPlaying(false);setFrame(+e.target.value);};
$('todayBtn').onclick=exitAnim;
function loop(now){ if(playing&&DATA&&DATA.dates&&DATA.dates.length>1){const dt=(now-lastT)/1000;lastT=now;
  let f=(typeof frame==='number'?frame:0)+dt*speed*2.5; if(f>=DATA.dates.length-1)f=0;
  frame=f; $('scrub').value=Math.round(f); $('pdate').textContent=(DATA.dates||[])[Math.round(f)]||'—'; drawBubble(); }
  requestAnimationFrame(loop);}
$('speeds').onclick=e=>{const b=e.target.closest('button');if(!b)return;speed=Number(b.dataset.s);
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));};

function select(name){sel=(sel===name?null:name);drawTable();drawDetail();drawBubble();}
function renderAll(){scopeText();drawBubble();drawTable();drawDetail();updatePlayerVisibility();}

tryFetch();
requestAnimationFrame(loop);
</script>
</body>
