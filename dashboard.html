<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>板塊資金儀表板 · 第一階段</title>
<style>
  :root{--bg:#0a141d;--panel:#10202c;--panel2:#0d1a24;--line:#22384a;--line-soft:#1a2c3a;
    --ink:#e8f1f6;--ink-dim:#8aa3b4;--ink-faint:#5b7688;--red:#ff495f;--red-soft:#ff8091;
    --green:#1ec98a;--green-soft:#5fe0b0;--amber:#f4b53f;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:radial-gradient(1100px 650px at 82% -10%,#14293a 0,transparent 60%),var(--bg);
    color:var(--ink);font-family:"Inter","Noto Sans TC","Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;padding:20px;}
  .num{font-family:"JetBrains Mono","SF Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;}
  .wrap{max-width:1120px;margin:0 auto;}
  .head{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;}
  h1{font-size:19px;font-weight:700;letter-spacing:.3px;}
  h1 .a{color:var(--amber);}
  .meta{font-size:11.5px;color:var(--ink-dim);text-align:right;line-height:1.5;}
  .meta b{color:var(--ink);}
  .banner{background:rgba(244,181,63,.12);border:1px solid #4a3a18;color:var(--amber);
    font-size:12px;padding:8px 12px;border-radius:9px;margin-top:12px;display:none;
    align-items:center;gap:10px;flex-wrap:wrap;}
  .banner.show{display:flex;}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);font-family:inherit;
    font-size:12px;padding:6px 12px;border-radius:8px;cursor:pointer;transition:.12s;}
  .btn:hover{border-color:var(--amber);color:var(--amber);}

  .grid{display:grid;grid-template-columns:1fr 380px;gap:16px;margin-top:14px;}
  @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--line);
    border-radius:13px;padding:12px;}
  .card h2{font-size:12px;color:var(--ink-faint);letter-spacing:.4px;margin-bottom:2px;font-weight:600;
    display:flex;justify-content:space-between;align-items:center;gap:8px;}
  svg{display:block;width:100%;height:auto;}
  .qlabel{font-size:11px;font-weight:700;letter-spacing:.3px;}
  .axtick{font-size:9px;fill:var(--ink-faint);}
  .axtitle{font-size:10px;fill:var(--ink-dim);}
  .blabel{font-size:10px;fill:var(--ink);pointer-events:none;}
  .bub{cursor:pointer;transition:opacity .1s;}

  /* 播放控制 */
  .player{display:flex;align-items:center;gap:10px;margin-top:8px;padding-top:8px;
    border-top:1px solid var(--line-soft);}
  .player.hidden{display:none;}
  .pbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto;transition:.12s;}
  .pbtn:hover{border-color:var(--amber);color:var(--amber);}
  input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;background:var(--line);
    border-radius:3px;outline:none;cursor:pointer;}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
    background:var(--amber);border:2px solid var(--bg);cursor:pointer;}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--amber);border:2px solid var(--bg);cursor:pointer;}
  .pdate{font-size:11.5px;color:var(--amber);min-width:86px;text-align:center;}
  .speeds{display:flex;gap:4px;}
  .speeds button{background:var(--panel);border:1px solid var(--line);color:var(--ink-dim);
    font-size:11px;padding:3px 7px;border-radius:6px;cursor:pointer;font-family:inherit;}
  .speeds button.on{border-color:var(--amber);color:var(--amber);}
  .today{font-size:11px;color:var(--ink-dim);text-decoration:underline;text-underline-offset:3px;
    background:none;border:none;cursor:pointer;font-family:inherit;}
  .today:hover{color:var(--ink);}

  table{width:100%;border-collapse:collapse;margin-top:4px;}
  th,td{padding:7px 9px;font-size:12.5px;text-align:right;white-space:nowrap;}
  th{font-size:10px;color:var(--ink-faint);letter-spacing:.3px;border-bottom:1px solid var(--line);
    cursor:pointer;user-select:none;}
  th.on{color:var(--amber);}
  th:first-child,td:first-child{text-align:left;}
  tbody tr{cursor:pointer;border-top:1px solid var(--line-soft);}
  tbody tr:hover{background:var(--panel2);}
  tbody tr.sel{background:rgba(244,181,63,.13);}
  td.name{font-weight:600;}
  .flag{color:var(--amber);}
  .pos{color:var(--red);} .neg{color:var(--green);} .dim{color:var(--ink-faint);}

  .detail .dh{font-size:16px;font-weight:800;margin-bottom:2px;}
  .detail .dmeta{font-size:11.5px;color:var(--ink-dim);margin-bottom:10px;}
  .split{display:flex;gap:8px;margin-bottom:12px;}
  .chip{flex:1;background:var(--panel2);border:1px solid var(--line-soft);border-radius:8px;padding:8px 10px;}
  .chip .k{font-size:10px;color:var(--ink-faint);}
  .chip .v{font-size:15px;font-weight:700;margin-top:2px;}
  .mem{max-height:230px;overflow-y:auto;}
  .mrow{display:grid;grid-template-columns:82px 1fr 58px;align-items:center;gap:8px;padding:4px 0;font-size:12px;}
  .mrow .mb{height:12px;border-radius:3px;opacity:.6;}
  .mrow .mv{text-align:right;}
  .spark{margin-top:12px;}
  .spark .sh{font-size:10.5px;color:var(--ink-faint);margin-bottom:3px;}
  .empty{color:var(--ink-faint);font-size:12.5px;padding:22px 6px;text-align:center;}
  .note{color:var(--ink-faint);font-size:11px;margin-top:14px;line-height:1.6;text-align:center;}
  input[type=file]{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1><span class="a">板塊資金</span>儀表板 <span style="font-size:12px;color:var(--ink-faint);font-weight:400">第一階段 · 法人資金</span></h1>
    <div class="meta" id="meta">載入中…</div>
  </div>

  <div class="banner" id="banner">
    <span id="bannerMsg"></span>
    <label class="btn">選擇 bubble_data.json<input type="file" id="fileIn" accept=".json"></label>
    <button class="btn" onclick="tryFetch()">重新自動載入</button>
  </div>

  <div class="grid">
    <div class="card">
      <h2><span id="bubTitle">板塊資金泡泡（三大法人）</span><span style="font-weight:400;color:var(--ink-faint)">X 強度% · Y 異常z · 大小 成交值</span></h2>
      <svg id="bubble" viewBox="0 0 640 440"></svg>
      <div class="player" id="player">
        <button class="pbtn" id="playBtn" aria-label="播放/暫停">
          <svg id="playIco" width="14" height="14" viewBox="0 0 16 16"><path d="M4 2.5v11l9-5.5z" fill="currentColor"/></svg>
        </button>
        <input type="range" id="scrub" min="0" max="0" value="0" step="1">
        <span class="pdate num" id="pdate">—</span>
        <div class="speeds" id="speeds">
          <button data-s="0.5">0.5×</button><button data-s="1" class="on">1×</button><button data-s="2">2×</button>
        </div>
        <button class="speeds" id="loopBtn" title="循環播放" style="padding:3px 8px;border:1px solid var(--amber);color:var(--amber);background:var(--panel);border-radius:6px;cursor:pointer;font-family:inherit;font-size:11px">🔁 循環</button>
        <button class="today" id="todayBtn">回到今日</button>
      </div>
    </div>
    <div class="card detail" id="detail">
      <div class="empty">點左邊泡泡或下方表格,看板塊明細</div>
    </div>
  </div>

  <div class="card" style="margin-top:16px;">
    <h2><span>資金流向表 <span style="font-weight:400;color:var(--ink-faint)">（最新一日）</span></span><span style="font-weight:400;color:var(--ink-faint)">點欄位標題排序 · 點列看明細</span></h2>
    <table>
      <thead><tr id="thead"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <div class="note">
    強度%＝淨流入÷成交值;z＝相對自己近20日。<span class="flag">⚑</span>＝成交值低於流動性門檻的小板塊,強度/z 易失真。<br>
    按 ▶ 可回放近20日板塊資金輪動軌跡(泡泡位置＝當日強度與異常度)。集中度/家數差的鑽取屬第二階段。
  </div>
</div>

<script>
// ── 範例資料(僅未載入真實檔時墊著) ──
const SAMPLE = {
  as_of_date:"範例", generated_at:"—", phase:1, config:{liquidity_floor_100m_twd:3.0, history_days:20},
  sectors:[
    {name:"晶圓製造",netflow_100m:6.0,netflow_foreign_100m:5.2,netflow_trust_100m:0.6,turnover_100m:40,intensity_pct:15.0,zscore:1.2,below_floor:false,
     members:[{name:"台積電",code:"2330",netflow_100m:5.1,turnover_100m:30},{name:"聯電",code:"2303",netflow_100m:0.9,turnover_100m:10}],
     history:Array.from({length:20},(_,i)=>({date:`D${i+1}`,netflow_100m:+(Math.sin(i/3)*2+2).toFixed(2),intensity_pct:8}))},
    {name:"探針卡",netflow_100m:3.0,netflow_foreign_100m:2.6,netflow_trust_100m:0.3,turnover_100m:4,intensity_pct:28.0,zscore:2.8,below_floor:false,
     members:[{name:"旺矽",code:"6223",netflow_100m:2.2,turnover_100m:2.5},{name:"穎崴",code:"6515",netflow_100m:0.8,turnover_100m:1.5}],
     history:Array.from({length:20},(_,i)=>({date:`D${i+1}`,netflow_100m:+(Math.random()*1.5+ (i>12?2:0)).toFixed(2),intensity_pct:12}))},
    {name:"ABF/BT",netflow_100m:-3.0,netflow_foreign_100m:-2.8,netflow_trust_100m:-0.1,turnover_100m:66,intensity_pct:-4.5,zscore:-1.1,below_floor:false,
     members:[{name:"欣興",code:"3037",netflow_100m:-1.6,turnover_100m:26},{name:"南電",code:"8046",netflow_100m:-1.4,turnover_100m:20}],
     history:Array.from({length:20},(_,i)=>({date:`D${i+1}`,netflow_100m:+(Math.cos(i/4)*2-1).toFixed(2),intensity_pct:-3}))},
    {name:"散熱",netflow_100m:1.5,netflow_foreign_100m:1.1,netflow_trust_100m:0.3,turnover_100m:46,intensity_pct:3.3,zscore:0.4,below_floor:false,
     members:[{name:"奇鋐",code:"3017",netflow_100m:1.0,turnover_100m:26},{name:"雙鴻",code:"3324",netflow_100m:0.5,turnover_100m:20}],
     history:Array.from({length:20},(_,i)=>({date:`D${i+1}`,netflow_100m:+(Math.sin(i/5)+0.5).toFixed(2),intensity_pct:2}))},
  ]
};

let DATA=null, sel=null, sortKey="netflow_100m", sortDir=-1, isSample=false;
// 動畫狀態
let frames=[], series={}, frame=null, playing=false, speed=1, lastT=0, domX=10, domY=1.5, loopMode=true;
const $=id=>document.getElementById(id);
const NS="http://www.w3.org/2000/svg";
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;
const std=a=>{const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)**2,0)/a.length);};

// ── 載入 ──
function tryFetch(){
  fetch('./data/bubble_data.json',{cache:"no-store"})
    .then(r=>{if(!r.ok)throw new Error(r.status);return r.json();})
    .then(d=>{ setData(d,false); $('banner').classList.remove('show'); })
    .catch(err=>{
      $('bannerMsg').textContent="無法自動讀取 ./data/bubble_data.json（"+err.message+"）。建議在資料夾內執行 python -m http.server 再開網頁,或手動選檔:";
      $('banner').classList.add('show');
      if(!DATA) setData(SAMPLE,true);
    });
}
$('fileIn').onchange=ev=>{
  const f=ev.target.files[0]; if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ setData(JSON.parse(rd.result),false); $('banner').classList.remove('show'); }
    catch(e){ $('bannerMsg').textContent="檔案解析失敗:"+e.message; } };
  rd.readAsText(f);
};
function setData(d,sample){
  DATA=d; isSample=sample; sel=null; frame=null; setPlaying(false);
  $('meta').innerHTML = sample
    ? '<b style="color:var(--amber)">範例資料</b>（尚未載入真實檔）'
    : `資料日 <b>${d.as_of_date}</b> · 產生於 ${d.generated_at||'—'} · ${d.sectors.length} 板塊`;
  buildSeries();
  renderAll();
}

// ── 由 history 建每日序列(前端算 z:擴張視窗) ──
function buildSeries(){
  series={}; frames=[];
  const lens=DATA.sectors.map(s=>(s.history||[]).length).filter(x=>x>0);
  const L=lens.length?Math.min(...lens):0;
  const player=$('player');
  if(L<3){ player.classList.add('hidden'); domX=10; domY=1.5; return; }
  player.classList.remove('hidden');
  frames=(DATA.sectors.find(s=>(s.history||[]).length>=L).history).slice(-L).map(h=>h.date);
  let maxX=10, maxY=1.5;
  DATA.sectors.forEach(s=>{
    const h=(s.history||[]).slice(-L);
    const nf=h.map(x=>x.netflow_100m);
    const arr=h.map((x,i)=>{
      let z=null; const prior=nf.slice(0,i);
      if(prior.length>=3){ const sd=std(prior); if(sd>0) z=(nf[i]-mean(prior))/sd; }
      const inten=(x.intensity_pct!=null?x.intensity_pct:0);
      maxX=Math.max(maxX,Math.abs(inten)); if(z!=null)maxY=Math.max(maxY,Math.abs(z));
      return {date:x.date, intensity:inten, netflow:x.netflow_100m, z:z};
    });
    series[s.name]=arr;
  });
  // 併入最新靜態值,確保軸涵蓋
  DATA.sectors.forEach(s=>{ maxX=Math.max(maxX,Math.abs(s.intensity_pct||0)); if(s.zscore!=null)maxY=Math.max(maxY,Math.abs(s.zscore)); });
  domX=maxX*1.15; domY=maxY*1.15;
  $('scrub').max=L-1; $('scrub').value=L-1;
}

// ── 取值 ──
const nf = s => s.netflow_100m ?? 0;
const fmt=(v,d=2,plus=true)=> (v==null?'—':(plus&&v>=0?'+':'')+Number(v).toFixed(d));
const col = v => v>=0?'var(--red)':'var(--green)';

// ── 泡泡圖(frame=null 靜態最新;否則動畫該日) ──
function drawBubble(){
  const svg=$('bubble'); svg.innerHTML='';
  const W=640,H=440,M={l:52,r:24,t:30,b:46};
  const animating = frame!=null && frames.length;
  const xMax = animating? domX : Math.max(10,...DATA.sectors.map(s=>Math.abs(s.intensity_pct||0)))*1.15;
  const yMax = animating? domY : Math.max(1.5,...DATA.sectors.map(s=>Math.abs(s.zscore||0)))*1.15;
  const toMax=Math.max(...DATA.sectors.map(s=>s.turnover_100m||0),1);
  const X=v=>M.l+(v+xMax)/(2*xMax)*(W-M.l-M.r);
  const Y=v=>M.t+(yMax-v)/(2*yMax)*(H-M.t-M.b);
  const cx=X(0),cy=Y(0);
  el('rect',{x:X(0),y:M.t,width:X(xMax)-X(0),height:cy-M.t,fill:'rgba(255,73,95,.07)'},svg);
  el('rect',{x:M.l,y:M.t,width:X(0)-M.l,height:cy-M.t,fill:'rgba(244,181,63,.05)'},svg);
  el('rect',{x:M.l,y:cy,width:X(0)-M.l,height:Y(-yMax)-cy,fill:'rgba(30,201,138,.06)'},svg);
  el('rect',{x:X(0),y:cy,width:X(xMax)-X(0),height:Y(-yMax)-cy,fill:'rgba(120,160,190,.04)'},svg);
  el('line',{x1:cx,y1:M.t,x2:cx,y2:Y(-yMax),stroke:'var(--line)','stroke-width':1.5},svg);
  el('line',{x1:M.l,y1:cy,x2:X(xMax),y2:cy,stroke:'var(--line)','stroke-width':1.5},svg);
  el('text',{x:X(xMax)-6,y:M.t+15,'text-anchor':'end',class:'qlabel',fill:'var(--red)'},svg).textContent='流入且異常熱';
  el('text',{x:M.l+6,y:Y(-yMax)-8,'text-anchor':'start',class:'qlabel',fill:'var(--green)'},svg).textContent='流出且偏冷';
  el('text',{x:cx,y:H-10,'text-anchor':'middle',class:'axtitle'},svg).textContent='挹注強度 %　流出 ← → 流入';
  el('text',{x:14,y:cy,'text-anchor':'middle',class:'axtitle',transform:`rotate(-90 14 ${cy})`},svg).textContent='異常度 z　冷 ← → 熱';

  // 選取板塊的軌跡(動畫時)
  if(animating && sel && series[sel]){
    const s=series[sel]; const from=Math.max(0,frame-6);
    let pts=[];
    for(let k=from;k<=frame;k++){ if(s[k].z!=null) pts.push([X(s[k].intensity),Y(s[k].z)]); }
    if(pts.length>1) el('path',{d:'M'+pts.map(p=>p.join(',')).join(' L'),fill:'none',stroke:'var(--amber)','stroke-width':1.5,opacity:.55},svg);
  }

  DATA.sectors.forEach(s=>{
    let x,y,c;
    if(animating && series[s.name]){
      const d=series[s.name][Math.round(frame)];
      x=X(d.intensity); y=Y(d.z==null?0:d.z); c=col(d.netflow);
    }else{
      x=X(s.intensity_pct??0); y=Y(s.zscore??0); c=col(nf(s));
    }
    const r=8+Math.sqrt((s.turnover_100m||0)/toMax)*24;
    const g=el('g',{class:'bub'},svg);
    g.addEventListener('click',()=>select(s.name));
    const faded = sel&&sel!==s.name;
    el('circle',{cx:x,cy:y,r,fill:c,opacity:faded?.22:.82,
      stroke:sel===s.name?'var(--amber)':c,'stroke-width':sel===s.name?2.5:1.5},g);
    if(!faded||sel===s.name)
      el('text',{x,y:y-r-4,'text-anchor':'middle',class:'blabel'},g).textContent=s.name+(s.below_floor?' ⚑':'');
  });
}

// ── 表格(恆最新日) ──
const COLS=[{k:"name",label:"板塊"},{k:"netflow_100m",label:"淨流入(億)"},{k:"intensity_pct",label:"強度%"},{k:"zscore",label:"z"},{k:"turnover_100m",label:"成交值(億)"}];
function drawTable(){
  const th=$('thead'); th.innerHTML='';
  COLS.forEach(c=>{
    const e=document.createElement('th');
    e.textContent=c.label+(sortKey===c.k?(sortDir<0?' ▼':' ▲'):'');
    e.className=sortKey===c.k?'on':'';
    e.onclick=()=>{ if(sortKey===c.k)sortDir*=-1; else{sortKey=c.k;sortDir=(c.k==="name"?1:-1);} drawTable(); };
    th.appendChild(e);
  });
  const rows=[...DATA.sectors].sort((a,b)=>{
    if(sortKey==="name") return sortDir*String(a.name).localeCompare(String(b.name),'zh-Hant');
    const va=a[sortKey]??-1e9, vb=b[sortKey]??-1e9; return sortDir*(va-vb);
  });
  const tb=$('tbody'); tb.innerHTML='';
  rows.forEach(s=>{
    const tr=document.createElement('tr');
    if(sel===s.name) tr.className='sel';
    tr.onclick=()=>select(s.name);
    tr.innerHTML=[
      `<td class="name">${s.below_floor?'<span class="flag">⚑</span> ':''}${s.name}</td>`,
      `<td class="num ${nf(s)>=0?'pos':'neg'}">${fmt(s.netflow_100m)}</td>`,
      `<td class="num ${(s.intensity_pct??0)>=0?'pos':'neg'}">${fmt(s.intensity_pct)}</td>`,
      `<td class="num ${(s.zscore??0)>=0?'pos':'neg'}">${s.zscore==null?'<span class="dim">—</span>':fmt(s.zscore,1)}</td>`,
      `<td class="num dim">${fmt(s.turnover_100m,1,false)}</td>`,
    ].join('');
    tb.appendChild(tr);
  });
}

// ── 明細(恆最新日) ──
function drawDetail(){
  const box=$('detail');
  if(!sel){ box.innerHTML='<div class="empty">點左邊泡泡或下方表格,看板塊明細</div>'; return; }
  const s=DATA.sectors.find(x=>x.name===sel); if(!s){box.innerHTML='';return;}
  const mem=[...(s.members||[])].sort((a,b)=>b.netflow_100m-a.netflow_100m);
  const mMax=Math.max(...mem.map(m=>Math.abs(m.netflow_100m)),0.01);
  let html=`<div class="dh">${s.below_floor?'<span class="flag">⚑</span> ':''}${s.name}</div>
    <div class="dmeta">淨流入 <b class="${nf(s)>=0?'pos':'neg'}">${fmt(s.netflow_100m)}億</b> ·
      強度 <b class="${(s.intensity_pct??0)>=0?'pos':'neg'}">${fmt(s.intensity_pct)}%</b> ·
      z <b class="${(s.zscore??0)>=0?'pos':'neg'}">${s.zscore==null?'—':fmt(s.zscore,1)}</b></div>
    <div class="split">
      <div class="chip"><div class="k">外資淨流入</div><div class="v num ${(s.netflow_foreign_100m??0)>=0?'pos':'neg'}">${fmt(s.netflow_foreign_100m)}</div></div>
      <div class="chip"><div class="k">投信淨流入</div><div class="v num ${(s.netflow_trust_100m??0)>=0?'pos':'neg'}">${fmt(s.netflow_trust_100m)}</div></div>
      <div class="chip"><div class="k">成交值(億)</div><div class="v num dim">${fmt(s.turnover_100m,1,false)}</div></div>
    </div>
    <div style="font-size:10.5px;color:var(--ink-faint);margin-bottom:5px">成分股淨流入(三大,億)</div>
    <div class="mem">`;
  mem.forEach(m=>{
    const w=Math.abs(m.netflow_100m)/mMax*100;
    html+=`<div class="mrow"><span>${m.name}<span class="dim num" style="font-size:10px"> ${m.code}</span></span>
      <span><span class="mb" style="display:block;width:${w}%;background:${col(m.netflow_100m)}"></span></span>
      <span class="mv num ${m.netflow_100m>=0?'pos':'neg'}">${fmt(m.netflow_100m)}</span></div>`;
  });
  html+='</div>';
  const h=s.history||[];
  if(h.length>1) html+=`<div class="spark"><div class="sh">近 ${h.length} 日淨流入(億)</div><svg id="spk" viewBox="0 0 340 60" style="width:100%;height:60px"></svg></div>`;
  box.innerHTML=html;
  if(h.length>1) drawSpark(h);
}
function drawSpark(h){
  const svg=$('spk'); if(!svg)return; svg.innerHTML='';
  const w=340,ht=60,pad=6; const vals=h.map(x=>x.netflow_100m);
  const mn=Math.min(0,...vals), mx=Math.max(0,...vals);
  const X=i=>pad+i/(h.length-1)*(w-2*pad);
  const Y=v=>ht-pad-(v-mn)/((mx-mn)||1)*(ht-2*pad);
  el('line',{x1:pad,y1:Y(0),x2:w-pad,y2:Y(0),stroke:'var(--line)','stroke-width':1},svg);
  // 播放時標出目前位置
  if(frame!=null && frame<h.length){ const xx=X(frame);
    el('line',{x1:xx,y1:6,x2:xx,y2:ht-6,stroke:'var(--amber)','stroke-width':1,opacity:.5},svg); }
  h.forEach((p,i)=>{ const x=X(i);
    el('line',{x1:x,y1:Y(0),x2:x,y2:Y(p.netflow_100m),stroke:col(p.netflow_100m),'stroke-width':2,opacity:.75},svg); });
  el('path',{d:'M'+h.map((p,i)=>X(i)+','+Y(p.netflow_100m)).join(' L'),fill:'none',stroke:'var(--amber)','stroke-width':1.5,opacity:.9},svg);
}

// ── 播放控制 ──
function setPlaying(p){
  playing=p;
  $('playIco').innerHTML = p
    ? '<rect x="3.5" y="2.5" width="3.5" height="11" fill="currentColor"/><rect x="9" y="2.5" width="3.5" height="11" fill="currentColor"/>'
    : '<path d="M4 2.5v11l9-5.5z" fill="currentColor"/>';
  lastT=performance.now();
}
function setFrame(i){
  frame=i;
  $('scrub').value=i;
  $('pdate').textContent = frames[i]||'—';
  $('bubTitle').textContent = '板塊資金泡泡 ▶ '+(frames[i]||'');
  drawBubble(); drawDetail();
}
function exitAnim(){
  frame=null; setPlaying(false);
  $('pdate').textContent='今日';
  $('bubTitle').textContent='板塊資金泡泡（三大法人）';
  if(frames.length) $('scrub').value=frames.length-1;
  drawBubble(); drawDetail();
}
$('playBtn').onclick=()=>{
  if(!frames.length)return;
  if(frame==null) frame=0;
  setPlaying(!playing);
};
$('scrub').oninput=e=>{ setPlaying(false); setFrame(+e.target.value); };
$('todayBtn').onclick=exitAnim;
$('loopBtn').onclick=e=>{ loopMode=!loopMode;
  e.target.style.opacity=loopMode?'1':'0.45';
  e.target.style.borderColor=loopMode?'var(--amber)':'var(--line)';
  e.target.style.color=loopMode?'var(--amber)':'var(--ink-dim)'; };
$('speeds').onclick=e=>{const b=e.target.closest('button');if(!b)return;speed=+b.dataset.s;
  [...e.currentTarget.children].forEach(x=>x.classList.toggle('on',x===b));};

function loop(now){
  if(playing && frames.length>1){
    const dt=(now-lastT)/1000; lastT=now;
    let f=(typeof frame==='number'?frame:0)+dt*speed*3; // 每秒約3格
    if(f>=frames.length-1){
      if(loopMode){ f=0; }                    // 循環:回到第一天
      else { f=frames.length-1; setPlaying(false); }
    }
    frame=f;
    const idx=Math.round(f);
    $('scrub').value=idx;
    $('pdate').textContent=frames[idx]||'—';
    $('bubTitle').textContent='板塊資金泡泡 ▶ '+(frames[idx]||'');
    renderFrameFloat(f);
  }
  requestAnimationFrame(loop);
}
// 平滑渲染:對浮點 frame 做線性內插
function renderFrameFloat(f){
  const i=Math.floor(f), t=f-i, j=Math.min(i+1,frames.length-1);
  drawBubbleInterp(i,j,t); drawDetail();
}
function drawBubbleInterp(i,j,t){
  const svg=$('bubble'); svg.innerHTML='';
  const W=640,H=440,M={l:52,r:24,t:30,b:46};
  const xMax=domX,yMax=domY,toMax=Math.max(...DATA.sectors.map(s=>s.turnover_100m||0),1);
  const X=v=>M.l+(v+xMax)/(2*xMax)*(W-M.l-M.r);
  const Y=v=>M.t+(yMax-v)/(2*yMax)*(H-M.t-M.b);
  const cx=X(0),cy=Y(0);
  el('rect',{x:X(0),y:M.t,width:X(xMax)-X(0),height:cy-M.t,fill:'rgba(255,73,95,.07)'},svg);
  el('rect',{x:M.l,y:M.t,width:X(0)-M.l,height:cy-M.t,fill:'rgba(244,181,63,.05)'},svg);
  el('rect',{x:M.l,y:cy,width:X(0)-M.l,height:Y(-yMax)-cy,fill:'rgba(30,201,138,.06)'},svg);
  el('rect',{x:X(0),y:cy,width:X(xMax)-X(0),height:Y(-yMax)-cy,fill:'rgba(120,160,190,.04)'},svg);
  el('line',{x1:cx,y1:M.t,x2:cx,y2:Y(-yMax),stroke:'var(--line)','stroke-width':1.5},svg);
  el('line',{x1:M.l,y1:cy,x2:X(xMax),y2:cy,stroke:'var(--line)','stroke-width':1.5},svg);
  el('text',{x:X(xMax)-6,y:M.t+15,'text-anchor':'end',class:'qlabel',fill:'var(--red)'},svg).textContent='流入且異常熱';
  el('text',{x:M.l+6,y:Y(-yMax)-8,'text-anchor':'start',class:'qlabel',fill:'var(--green)'},svg).textContent='流出且偏冷';
  el('text',{x:cx,y:H-10,'text-anchor':'middle',class:'axtitle'},svg).textContent='挹注強度 %　流出 ← → 流入';
  el('text',{x:14,y:cy,'text-anchor':'middle',class:'axtitle',transform:`rotate(-90 14 ${cy})`},svg).textContent='異常度 z　冷 ← → 熱';
  const lerp=(a,b)=>a+(b-a)*t;
  if(sel && series[sel]){
    const s=series[sel]; const from=Math.max(0,i-6); let pts=[];
    for(let k=from;k<=i;k++){ if(s[k].z!=null) pts.push([X(s[k].intensity),Y(s[k].z)]); }
    if(pts.length>1) el('path',{d:'M'+pts.map(p=>p.join(',')).join(' L'),fill:'none',stroke:'var(--amber)','stroke-width':1.5,opacity:.5},svg);
  }
  DATA.sectors.forEach(s=>{
    const a=series[s.name][i], b=series[s.name][j];
    const x=X(lerp(a.intensity,b.intensity)), y=Y(lerp(a.z==null?0:a.z, b.z==null?0:b.z));
    const c=col(lerp(a.netflow,b.netflow));
    const r=8+Math.sqrt((s.turnover_100m||0)/toMax)*24;
    const g=el('g',{class:'bub'},svg); g.addEventListener('click',()=>select(s.name));
    const faded=sel&&sel!==s.name;
    el('circle',{cx:x,cy:y,r,fill:c,opacity:faded?.22:.82,stroke:sel===s.name?'var(--amber)':c,'stroke-width':sel===s.name?2.5:1.5},g);
    if(!faded||sel===s.name) el('text',{x,y:y-r-4,'text-anchor':'middle',class:'blabel'},g).textContent=s.name+(s.below_floor?' ⚑':'');
  });
}

function select(name){
  sel=(sel===name?null:name);
  drawTable(); drawDetail();
  if(frame==null) drawBubble(); else renderFrameFloat(frame);
}
function renderAll(){ drawBubble(); drawTable(); drawDetail(); }

tryFetch();
requestAnimationFrame(loop);
</script>
</body>
</html>
